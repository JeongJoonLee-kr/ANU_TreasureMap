name: godot-autoformat

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "Godot_Game/anu-treasure-map/**/*.gd"

permissions:
  contents: write

env:
  GODOT_PROJECT_PATH: Godot_Game/anu-treasure-map

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install formatter
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdtoolkit==4.*"

      - name: Run gdformat
        run: gdformat "$GODOT_PROJECT_PATH"

      - name: Detect formatting changes
        id: diff
        run: |
          if git diff --quiet -- "$GODOT_PROJECT_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatted files
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GODOT_PROJECT_PATH"
          git commit -m "style: auto-format Godot scripts"
          git push
