name: godot-ci

on:
  pull_request:
    paths:
      - "Godot_Game/anu-treasure-map/**"
      - ".github/workflows/godot-ci.yml"
      - ".gdlintrc"
      - ".editorconfig"
      - "scripts/ci/**"
      - "CONTRIBUTING.md"
  push:
    branches:
      - main
    paths:
      - "Godot_Game/anu-treasure-map/**"
      - ".github/workflows/godot-ci.yml"
      - ".gdlintrc"
      - ".editorconfig"
      - "scripts/ci/**"
      - "CONTRIBUTING.md"

env:
  GODOT_VERSION: 4.5-stable
  GODOT_PROJECT_PATH: Godot_Game/anu-treasure-map

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdtoolkit==4.*"

      - name: Run gdlint
        run: gdlint "$GODOT_PROJECT_PATH"

      - name: Check formatting
        run: gdformat --check "$GODOT_PROJECT_PATH"

      - name: Validate location data
        run: python scripts/ci/validate_locations.py

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot
        run: bash scripts/ci/install_godot.sh

      - name: Import project in headless mode
        run: |
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT_PATH" --import

      - name: Run smoke test
        run: |
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT_PATH" --script res://tests/ci/smoke_test.gd

  build-windows:
    runs-on: ubuntu-latest
    needs:
      - lint
      - smoke-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot
        run: bash scripts/ci/install_godot.sh

      - name: Export Windows build
        run: |
          mkdir -p "$GODOT_PROJECT_PATH/build/windows"
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT_PATH" --export-release "ANU Treasure Map" "build/windows/ANU_Treasure_Map.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: anu-treasure-map-windows
          path: |
            Godot_Game/anu-treasure-map/build/windows/**
