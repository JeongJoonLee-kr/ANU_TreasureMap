name: godot-ci

on:
  pull_request:
    paths:
      - "Godot_Game/anu-treasure-map/**"
      - ".github/workflows/godot-ci.yml"
      - ".gdlintrc"
      - ".editorconfig"
      - "scripts/ci/**"
      - "CONTRIBUTING.md"
  push:
    branches:
      - main
    paths:
      - "Godot_Game/anu-treasure-map/**"
      - ".github/workflows/godot-ci.yml"
      - ".gdlintrc"
      - ".editorconfig"
      - "scripts/ci/**"
      - "CONTRIBUTING.md"

env:
  GODOT_VERSION: 4.5-stable
  GODOT_PROJECT_PATH: Godot_Game/anu-treasure-map

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdtoolkit==4.*"

      - name: Run gdlint
        id: gdlint
        continue-on-error: true
        run: |
          set -o pipefail
          gdlint "$GODOT_PROJECT_PATH" | tee /tmp/gdlint.log

      - name: Check formatting
        id: gdformat
        continue-on-error: true
        run: |
          set -o pipefail
          gdformat --check "$GODOT_PROJECT_PATH" | tee /tmp/gdformat.log

      - name: Validate location data
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/ci/validate_locations.py | tee /tmp/validate.log

      - name: Build lint comment body
        if: github.event_name == 'pull_request'
        id: lint_comment
        run: |
          python scripts/ci/render_lint_comment.py \
            --gdlint /tmp/gdlint.log \
            --gdformat /tmp/gdformat.log \
            --validate /tmp/validate.log

      - name: Sync lint comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ steps.lint_comment.outputs.body }}
        with:
          script: |
            const marker = "<!-- godot-lint-comment -->";
            const body = process.env.COMMENT_BODY;
            const hasFailures = [
              "${{ steps.gdlint.outcome }}",
              "${{ steps.gdformat.outcome }}",
              "${{ steps.validate.outcome }}",
            ].some((outcome) => outcome !== "success");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (hasFailures && existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else if (hasFailures) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            } else if (existing) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existing.id,
              });
            }

      - name: Mark lint job as failed if checks failed
        if: steps.gdlint.outcome != 'success' || steps.gdformat.outcome != 'success' || steps.validate.outcome != 'success'
        run: exit 1

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot
        run: bash scripts/ci/install_godot.sh

      - name: Import project in headless mode
        run: |
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT_PATH" --import

      - name: Run smoke test
        run: |
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT_PATH" --script res://tests/ci/smoke_test.gd
