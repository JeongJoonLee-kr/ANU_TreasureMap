<svg width="400" height="60" viewBox="0 0 400 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="60" rx="2" fill="white" fill-opacity="0.7"/>
  <rect width="400" height="60" rx="2" stroke="#EF5350" stroke-width="2"/>

  <!-- Selection Indicator -->
  <rect x="0" y="0" width="4" height="60" fill="#EF5350"/>

  <!-- Icon Container - Filled -->
  <circle cx="40" cy="30" r="20" fill="#EF5350" stroke="#EF5350" stroke-width="2"/>

  <!-- Circle Icon (selected state) -->
