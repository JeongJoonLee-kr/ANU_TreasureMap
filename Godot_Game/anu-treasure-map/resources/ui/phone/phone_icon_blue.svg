<svg width="68" height="68" viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42A5F5"/>
      <stop offset="1" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>

  <!-- Godot/ThorVG: replace unsupported blur filter with flat shadow layer -->
  <rect x="2" y="4" width="64" height="64" rx="16" fill="#000000" fill-opacity="0.24"/>
  <rect width="64" height="64" rx="16" fill="url(#blueGradient)"/>

  <!-- Phone icon -->
  <rect x="24" y="20" width="16" height="24" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="30" y1="23" x2="34" y2="23" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="32" cy="40" r="1.5" fill="#FFFFFF"/>
</svg>
